# Po každom zlúčení do main sa appka sama zostaví a nahrá na GitHub Pages (vetva gh-pages).
name: Nasadenie na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /stullers-home-app/
          # Verejné údaje, aj tak sú viditeľné v zostavenej stránke. Dáta chránia pravidlá RLS.
          VITE_SUPABASE_URL: https://ldneuhnzzjzlzjqbqhnu.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_91W7LPGRULgyYJKu59N0wg_8PMPJq2H
      - name: Nahrať do vetvy gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A
          git commit -qm "Nasadenie ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
